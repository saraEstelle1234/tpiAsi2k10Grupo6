<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07101E" />
      <stop offset="45%" stop-color="#0B1E38" />
      <stop offset="100%" stop-color="#0D2E5C" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#2D7FF9" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.3" />
    </linearGradient>

    <!-- Shield Primary Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>

    <!-- Shield Accent Stroke -->
    <linearGradient id="shieldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="40%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Classical Architectural Elements Gradient -->
    <linearGradient id="columnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="35%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Gold/Amber Alert & Heritage Accent -->
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Cyan Pulse Gradient -->
    <radialGradient id="pulseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#0284C7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="beaconGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- Background Radar / Surveillance Sensor Arcs -->
  <g opacity="0.35">
    <circle cx="256" cy="256" r="190" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6 8" />
    <circle cx="256" cy="256" r="140" fill="none" stroke="#2D7FF9" stroke-width="1.8" />
    <circle cx="256" cy="256" r="90" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 6" />
    <!-- Scanning Radar Sweep Line -->
    <line x1="256" y1="256" x2="390" y2="122" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Outer Security Shield (Surveillance & Custody) -->
  <path d="M 256 75
           C 345 75, 415 105, 415 155
           C 415 285, 345 375, 256 425
           C 167 375, 97 285, 97 155
           C 97 105, 167 75, 256 75 Z"
        fill="url(#shieldGrad)"
        stroke="url(#shieldStroke)"
        stroke-width="7"
        filter="url(#glow)" />

  <!-- Shield Inner Border Accent -->
  <path d="M 256 95
           C 330 95, 395 120, 395 162
           C 395 272, 330 352, 256 398
           C 182 352, 117 272, 117 162
           C 117 120, 182 95, 256 95 Z"
        fill="none"
        stroke="#38BDF8"
        stroke-width="2"
        stroke-opacity="0.45" />

  <!-- Ambient Blue Core Glow behind Museum -->
  <circle cx="256" cy="245" r="85" fill="url(#pulseGlow)" filter="url(#beaconGlow)" />

  <!-- MUSEUM TEMPLE STRUCTURE -->
  <!-- Pediment / Frontón Triangular -->
  <polygon points="256,135 145,198 367,198" fill="url(#columnGrad)" filter="url(#glow)" />
  <!-- Pediment Lower Cornice / Entablamento -->
  <rect x="138" y="198" width="236" height="14" rx="3" fill="#FFFFFF" />

  <!-- Pediment Medallion: Vigilance Beacon / Sensor -->
  <circle cx="256" cy="174" r="16" fill="#0B1E38" stroke="#38BDF8" stroke-width="3" />
  <circle cx="256" cy="174" r="8" fill="url(#goldGlow)" filter="url(#glow)" />
  <circle cx="256" cy="174" r="3" fill="#FFFFFF" />

  <!-- 4 Classical Columns with Capital and Base -->
  <!-- Column 1 -->
  <rect x="160" y="218" width="22" height="102" rx="4" fill="url(#columnGrad)" />
  <rect x="154" y="213" width="34" height="6" rx="2" fill="#FFFFFF" />
  <rect x="154" y="318" width="34" height="6" rx="2" fill="#BAE6FD" />

  <!-- Column 2 -->
  <rect x="214" y="218" width="22" height="102" rx="4" fill="url(#columnGrad)" />
  <rect x="208" y="213" width="34" height="6" rx="2" fill="#FFFFFF" />
  <rect x="208" y="318" width="34" height="6" rx="2" fill="#BAE6FD" />

  <!-- Column 3 -->
  <rect x="276" y="218" width="22" height="102" rx="4" fill="url(#columnGrad)" />
  <rect x="270" y="213" width="34" height="6" rx="2" fill="#FFFFFF" />
  <rect x="270" y="318" width="34" height="6" rx="2" fill="#BAE6FD" />

  <!-- Column 4 -->
  <rect x="330" y="218" width="22" height="102" rx="4" fill="url(#columnGrad)" />
  <rect x="324" y="213" width="34" height="6" rx="2" fill="#FFFFFF" />
  <rect x="324" y="318" width="34" height="6" rx="2" fill="#BAE6FD" />

  <!-- Museum Portico / Entryway Arch (Dark depth) -->
  <path d="M 244 318 L 244 266 C 244 256, 268 256, 268 266 L 268 318 Z" fill="#0A182F" opacity="0.8" />

  <!-- Plinth / Escalinata Base (Gradual Steps) -->
  <rect x="142" y="324" width="228" height="12" rx="3" fill="#FFFFFF" />
  <rect x="128" y="336" width="256" height="14" rx="4" fill="url(#columnGrad)" />
  <rect x="114" y="350" width="284" height="12" rx="4" fill="#64748B" />

  <!-- Natural History Heritage Emblem at Bottom Crest: Ammonite / Fossil Spiral Touch -->
  <g transform="translate(256, 388)">
    <!-- Cyan Diamond Badge -->
    <path d="M 0 -14 L 14 0 L 0 14 L -14 0 Z" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2" filter="url(#glow)" />
    <!-- Center Core Dot -->
    <circle cx="0" cy="0" r="4" fill="#07101E" />
    <circle cx="0" cy="0" r="2" fill="#38BDF8" />
  </g>
</svg>